<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar-container" id="avatarContainer">
          <img src="images/avatar.png" alt="头像" class="avatar" id="avatarImg" onerror="this.style.display='none'">
        </div>
        <h1 class="site-title">我的博客</h1>
        <p class="site-subtitle">记录思考，分享生活</p>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索文章..." class="search-input">
        <button class="search-btn" id="searchBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
      </div>

      <!-- 标签云 -->
      <div class="tag-cloud-section">
        <h3 class="sidebar-title">标签云</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>

      <!-- 关于信息 -->
      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">这是一个纯静态个人博客，专注于 AI 绘画提示词分享与技术教程。</p>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-number" id="articleCount">0</span>
            <span class="stat-label">文章</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="tagCount">0</span>
            <span class="stat-label">标签</span>
          </div>
        </div>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title" id="contentTitle">全部文章</h2>
        <span class="content-count" id="contentCount">0 篇</span>
      </header>

      <section class="articles-list" id="articlesList"></section>
    </main>
  </div>

  <!-- 文章详情全屏 -->
  <aside class="article-detail" id="articleDetail">
    <div class="detail-content">
      <button class="close-btn" id="closeDetail" aria-label="关闭文章">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </aside>

  <!-- 角色资料弹窗 -->
  <aside class="profile-modal" id="profileModal">
    <div class="profile-content">
      <button class="profile-close-btn" id="profileCloseBtn">✕</button>
      <div class="profile-header">
        <div class="profile-title">角色档案</div>
        <div class="profile-subtitle">CHARACTER PROFILE</div>
      </div>
      <div class="profile-body">
        <!-- 左侧信息 -->
        <div class="profile-left">
          <div class="data-line" id="line1"></div>
          <div class="data-line" id="line2"></div>
          <div class="data-line" id="line3"></div>
          <div class="data-line" id="line4"></div>
          <div class="info-item" data-label="昵称">Sparta-Silence</div>
          <div class="info-item" data-label="性别">男</div>
          <div class="info-item" data-label="年龄">23岁</div>
          <div class="info-item" data-label="生日">5月1日</div>
        </div>
        <!-- 中间头像 -->
        <div class="profile-center">
          <div class="avatar-frame">
            <div class="avatar-glow"></div>
            <img src="images/avatar.png" alt="头像" class="profile-avatar" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22><rect width=%2280%22 height=%2280%22 fill=%22%233d2b5e%22/><text x=%2240%22 y=%2245%22 text-anchor=%22middle%22 fill=%22%23ffd700%22 font-size=%2230%22>?</text></svg>'">
          </div>
          <div class="avatar-decoration"></div>
        </div>
        <!-- 右侧信息 -->
        <div class="profile-right">
          <div class="data-line" id="line5"></div>
          <div class="data-line" id="line6"></div>
          <div class="data-line" id="line7"></div>
          <div class="data-line" id="line8"></div>
          <div class="info-item" data-label="邮箱">3291614511@qq.com</div>
          <div class="info-item" data-label="GitHub">暂无</div>
          <div class="info-item" data-label="专业">软件工程</div>
          <div class="info-item" data-label="兴趣">听歌、打游戏</div>
        </div>
      </div>
      <div class="profile-footer">
        <div class="pixel-decoration">◆ ◆ ◆</div>
      </div>
    </div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
