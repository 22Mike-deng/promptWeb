<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1 class="site-title">我的博客</h1>
      <p class="site-subtitle">记录思考，分享生活</p>
    </div>
  </header>

  <main class="container">
    <nav class="tag-filter" id="tagFilter"></nav>
    <section class="articles-grid" id="articlesGrid"></section>
  </main>

  <aside class="article-detail" id="articleDetail">
    <div class="detail-content">
      <button class="close-btn" id="closeDetail" aria-label="关闭文章">&times;</button>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </aside>

  <footer class="site-footer">
    <p>&copy; 2024 我的个人博客</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
