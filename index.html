<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="site-title">我的博客</h1>
        <p class="site-subtitle">记录思考，分享生活</p>
      </div>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索文章..." class="search-input">
        <button class="search-btn" id="searchBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
        </button>
      </div>

      <!-- 标签云 -->
      <div class="tag-cloud-section">
        <h3 class="sidebar-title">标签云</h3>
        <div class="tag-cloud" id="tagCloud"></div>
      </div>

      <!-- 关于信息 -->
      <div class="about-section">
        <h3 class="sidebar-title">关于</h3>
        <p class="about-text">这是一个纯静态个人博客，专注于 AI 绘画提示词分享与技术教程。</p>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-number" id="articleCount">0</span>
            <span class="stat-label">文章</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="tagCount">0</span>
            <span class="stat-label">标签</span>
          </div>
        </div>
      </div>

      <footer class="sidebar-footer">
        <p>&copy; 2026 我的个人博客</p>
      </footer>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <header class="content-header">
        <h2 class="content-title" id="contentTitle">全部文章</h2>
        <span class="content-count" id="contentCount">0 篇</span>
      </header>

      <section class="articles-list" id="articlesList"></section>
    </main>
  </div>

  <!-- 文章详情全屏 -->
  <aside class="article-detail" id="articleDetail">
    <div class="detail-content">
      <button class="close-btn" id="closeDetail" aria-label="关闭文章">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
      <div class="detail-body" id="detailBody"></div>
    </div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
